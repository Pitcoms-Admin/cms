name: Deploy pitcoms.com to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Build index.html from CMS content
        run: |
          python3 - <<'PYEOF'
          import shutil
          import yaml
          from pathlib import Path

          data = yaml.safe_load(Path("content/homepage.yml").read_text())
          html = data["body"]

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          (dist / "index.html").write_text(html)
          (dist / "CNAME").write_text("pitcoms.com\n")
          (dist / ".nojekyll").write_text("")
          print(f"Wrote dist/index.html ({len(html)} bytes)")

          # Carry the Decap CMS admin app (and any uploaded media) straight
          # through to the deployed site so /admin/ isn't a 404.
          for folder in ("admin", "assets"):
              src = Path(folder)
              if src.is_dir():
                  shutil.copytree(src, dist / folder, dirs_exist_ok=True)
                  print(f"Copied {folder}/ -> dist/{folder}/")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
